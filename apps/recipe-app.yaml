apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recipe-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/NavaSasson/gitops-config.git
    targetRevision: HEAD
    path: charts/recipe-app
    helm:
      version: v3
      parameters:
        - name: mongodb.architecture
          value: standalone
        - name: mongodb.auth.enabled
          value: "true"
        - name: mongodb.podSecurityContext.enabled
          value: "false"
        - name: mongodb.containerSecurityContext.enabled
          value: "false"
        - name: mongodb.networkPolicy.enabled
          value: "false"
        - name: mongodb.pdb.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: recipe-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # syncOptions:
    #   - CreateNamespace=true