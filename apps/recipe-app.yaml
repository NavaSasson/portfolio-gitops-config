# apps/templates/recipe-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recipe-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NavaSasson/gitops-config.git
    targetRevision: HEAD
    path: charts/recipe-app
  destination:
    server: https://kubernetes.default.svc
    namespace: recipe-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true