apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recipe-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:NavaSasson/gitops-config.git
    targetRevision: HEAD
    path: charts/recipe-app
    helm:
      valueFiles:
        - values.yaml
      version: v3
  destination:
    server: https://kubernetes.default.svc
    namespace: recipe-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true