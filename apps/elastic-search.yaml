apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elasticsearch
spec:
  source:
    repoURL: 'https://helm.elastic.co'
    targetRevision: 8.5.1
    chart: elasticsearch
    helm:
      values: |
        resources:
          requests:
            cpu: "150m"
            memory: "256Mi"
        replicas: 1
        minimumMasterNodes: 1
        volumeClaimTemplate:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
          storageClassName: nava-ebs-sc
        secret:
          enabled: true
          existingSecret: "elasticsearch-secret"
          passwordKey: "elasticsearch-password"
  destination:
    namespace: logging
    server: 'https://kubernetes.default.svc'
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

