apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elasticsearch
spec:
  destination:
    namespace: argocd
  source:
    repoURL: 'https://helm.elastic.co'
    targetRevision: 8.5.1
    chart: elasticsearch
    helm:
        valueFiles:
          - $values/values/elastic-values.yaml
  - repoURL: "https://github.com/NavaSasson/gitops-config.git"
    targetRevision: HEAD
    ref: values
  destination:
    namespace: logging
    server: 'https://kubernetes.default.svc'
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      
