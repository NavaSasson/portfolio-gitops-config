apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibana
spec:
  source:
    repoURL: 'https://helm.elastic.co'
    targetRevision: 8.5.1
    chart: kibana
    helm:
      values: |
        resources:
          requests:
            cpu: "150m"
            memory: "256Mi"
        extraEnvs:
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: ELASTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: elasticsearch-secret
                key: elasticsearch-password
        replicas: 1
  destination:
    namespace: logging
    server: 'https://kubernetes.default.svc'
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true