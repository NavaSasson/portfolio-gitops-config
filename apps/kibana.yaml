apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibana
spec:
  destination:
    namespace: logging
    server: 'https://kubernetes.default.svc'
  source:
    repoURL: 'https://helm.elastic.co'
    targetRevision: 8.5.1
    chart: kibana
    helm:
      values: |
        service:
          type: ClusterIP
        resources:
          requests:
            cpu: "150m"
            memory: "256Mi"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: logging
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true