apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kibana
spec:
  source:
    repoURL: 'https://helm.elastic.co'
    targetRevision: 8.5.1
    chart: kibana
    helm:
      valueFiles:
        - $values/values/kibana-values.yaml
  - repoURL: "https://github.com/NavaSasson/gitops-config.git"
    targetRevision: HEAD
    ref: values
  destination:
    namespace: logging
    server: 'https://kubernetes.default.svc'
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

