prometheus:
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: 'recipe-app'
        scheme: https
        tls_config:
          insecure_skip_verify: true  # Disable TLS verification
        static_configs:
          - targets: ['recipe-app.hopto.org:443']

grafana:
 enabled: true
 persistence:
   enabled: true
   type: sts
   storageClassName: nava-ebs-sc
   accessModes:
     - ReadWriteOnce
   size: 5Gi
   finalizers:
     - kubernetes.io/pvc-protection

crds:
 enabled: true