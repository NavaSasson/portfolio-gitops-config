logLevel: info

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

    [INPUT]
        Name tail
        Path /var/log/containers/recipe-app-ingress*.log
        Tag nginx.*
        Mem_Buf_Limit 100MB
        Skip_Long_Lines On

    [INPUT]
        Name tail
        Path /var/log/containers/recipe-app-*.log
        Tag recipe-app.*
        Mem_Buf_Limit 100MB
        Skip_Long_Lines On

    [INPUT]
        Name tail
        Path /var/log/containers/*mongodb*.log
        Tag mongodb.*
        Mem_Buf_Limit 100MB
        Skip_Long_Lines On

    [INPUT]
        Name systemd
        Tag host.*
        Systemd_Filter _SYSTEMD_UNIT=kubelet.service
        Read_From_Tail On

    [INPUT]
        Name http
        Tag prometheus_metrics
        Listen 0.0.0.0
        Port 2021

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off

    [FILTER]
        Name grep
        Match kube.*
        Regex log ^(?!.*\bGET /health\b).*$

    [FILTER]
        Name kubernetes
        Match recipe-app.*
        Merge_Log On
        Keep_Log Off

    [FILTER]
        Name kubernetes
        Match nginx.*
        Merge_Log On
        Keep_Log Off

    [FILTER]
        Name parser
        Match nginx.*
        Key_Name log
        Parser recipe_app_nginx
        Reserve_Data On

    [FILTER]
        Name parser
        Match mongodb.*
        Key_Name log
        Parser recipe_app_mongodb
        Reserve_Data On

    [FILTER]
        Name modify
        Match mongodb.*
        Set log_level ERROR
        Condition Key_value_matches msg .*error.*

    [FILTER]
        Name modify
        Match mongodb.*
        Set log_level INFO
        Condition Key_value_does_not_match msg .*error.*

    [FILTER]
        Name record_modifier
        Match prometheus_metrics
        Record hostname recipe-app-prometheus
        Record app_name recipe-app
        Record cluster_name recipe-app-cluster

  customParsers: |
    [PARSER]
        Name recipe_app_nginx
        Format regex
        Regex ^(?<remote_addr>[^ ]*) - (?<remote_user>[^ ]*) \[(?<time_local>[^\]]*)\] \"(?<method>[A-Z]+) (?<request>[^ ]*) (?<protocol>[^\"]*)\" (?<status>[0-9]{3}) (?<body_bytes_sent>[0-9]+) \"(?<http_referer>[^\"]*)\" \"(?<http_user_agent>[^\"]*)\"
        Time_Key time_local
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name recipe_app_mongodb
        Format json
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ

  outputs: |
    [OUTPUT]
        Name es
        Match kube.*
        Host elasticsearch-master
        Port 9200
        HTTP_User elastic
        HTTP_Passwd 9sRLSqZOhtUpSpyn
        Logstash_Format On
        Logstash_Prefix kube
        Retry_Limit False
        Suppress_Type_Name On
        Time_Key @timestamp
        Include_Tag_Key On
        Tag_Key tag
        tls On
        tls.verify Off
        Buffer_Size 1MB
        Trace_Error On

    [OUTPUT]
        Name es
        Match recipe-app.*
        Host elasticsearch-master
        Port 9200
        HTTP_User elastic
        HTTP_Passwd 9sRLSqZOhtUpSpyn
        Logstash_Format On
        Logstash_Prefix recipe-app
        Retry_Limit False
        Suppress_Type_Name On
        Time_Key @timestamp
        Include_Tag_Key On
        Tag_Key tag
        tls On
        tls.verify Off
        Buffer_Size 1MB
        Trace_Error On

    [OUTPUT]
        Name es
        Match nginx.*
        Host elasticsearch-master
        Port 9200
        HTTP_User elastic
        HTTP_Passwd 9sRLSqZOhtUpSpyn
        Logstash_Format On
        Logstash_Prefix nginx
        Retry_Limit False
        Suppress_Type_Name On
        Time_Key @timestamp
        Include_Tag_Key On
        Tag_Key tag
        tls On
        tls.verify Off
        Buffer_Size 1MB
        Trace_Error On

    [OUTPUT]
        Name es
        Match mongodb.*
        Host elasticsearch-master
        Port 9200
        HTTP_User elastic
        HTTP_Passwd 9sRLSqZOhtUpSpyn
        Logstash_Format On
        Logstash_Prefix mongodb
        Retry_Limit False
        Suppress_Type_Name On
        Time_Key @timestamp
        Include_Tag_Key On
        Tag_Key tag
        tls On
        tls.verify Off
        Buffer_Size 1MB
        Trace_Error On

    [OUTPUT]
        Name es
        Match *
        Host elasticsearch-master-hl.logging.svc.cluster.local
        Port 9200
        HTTP_User elastic
        HTTP_Passwd 9sRLSqZOhtUpSpyn
        Logstash_Format On
        Logstash_Prefix host
        Retry_Limit False
        Suppress_Type_Name On
        Time_Key @timestamp
        Include_Tag_Key On
        Tag_Key tag
        tls On
        tls.verify Off
        Buffer_Size 1MB
        Trace_Error On

    [OUTPUT]
        Name es
        Match prometheus_metrics
        Host elasticsearch-master
        Port 9200
        HTTP_User elastic
        HTTP_Passwd 9sRLSqZOhtUpSpyn
        Logstash_Format On
        Logstash_Prefix metrics
        Retry_Limit False
        Suppress_Type_Name On
        Time_Key @timestamp
        Include_Tag_Key On
        Tag_Key tag
        tls On
        tls.verify Off
        Buffer_Size 1MB
        Trace_Error On