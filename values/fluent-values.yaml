config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level debug
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Parser cri
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
        Refresh_Interval 10
        DB /var/log/flb_kube.db

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude Off

    [FILTER]
        Name grep
        Match kube.*
        Regex log ^(?!.*\bGET /health\b).*$

  customParsers: |
    [PARSER]
        Name cri
        Format regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

    [PARSER]
        Name python
        Format regex
        Regex ^(?<time>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2},\d{3})\s+-\s+(?<name>[^ ]*)\s+-\s+(?<level>[^ ]*)\s+-\s+\[(?<filename>[^\]]*)\]\s+-\s+(?<message>.*)$
        Time_Key time
        Time_Format %Y-%m-%d %H:%M:%S,%L
        Time_Keep On

  outputs: |
    [OUTPUT]
        Name es
        Match kube.*
        Host elasticsearch-master-hl.logging.svc.cluster.local
        Port 9200
        HTTP_User elastic
        HTTP_Passwd 9sRLSqZOhtUpSpyn
        Logstash_Format On
        Logstash_Prefix fluent-bit
        Retry_Limit False
        Suppress_Type_Name On
        Time_Key @timestamp
        Include_Tag_Key On
        Tag_Key tag
        tls Off
        tls.verify Off
        Buffer_Size 1MB
        Trace_Error On
        Trace_Output On

    [OUTPUT]
        Name stdout
        Match kube.*