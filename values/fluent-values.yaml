logLevel: info

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level debug
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Tag kube.*
        multiline.parser docker, cri
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        Buffer_Size False

  customParsers: |
    [PARSER]
        Name nginx_parser
        Format regex
        Regex ^(?<remote_addr>[^ ]*) - (?<remote_user>[^ ]*) \[(?<time_local>[^\]]*)\] \"(?<method>[A-Z]+) (?<request>[^ ]*) (?<protocol>[^\"]*)\" (?<status>[0-9]{3}) (?<body_bytes_sent>[0-9]+) \"(?<http_referer>[^\"]*)\" \"(?<http_user_agent>[^\"]*)\"
        Time_Key time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name mongodb_json_parser
        Format json
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    
    [PARSER]
        Name json_parser
        Format json
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%NZ

    [PARSER]
        Name regex_parser
        Format regex
        Regex /^(?<time>.+) (?<stream>stdout|stderr) [^ ]* (?<log>.*)$/
        Time_Format %Y-%m-%dT%H:%M:%S.%N%:z

  outputs: |
    [OUTPUT]
        Name es
        Match *
        Index fluent-bit
        Type  _doc
        Host elasticsearch-master.logging.svc.cluster.local
        Port 9200
        HTTP_User elastic
        HTTP_Passwd 9sRLSqZOhtUpSpyn
        Logstash_Format On
        Logstash_Prefix kube
        Retry_Limit False
        Suppress_Type_Name On
        tls On
        tls.verify Off