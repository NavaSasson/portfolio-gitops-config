logLevel: info

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level debug
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/recipe-app-ingress-nginx-controller-*.log
        multiline.parser docker, cri
        Tag nginx.*
        Mem_Buf_Limit 100MB
        Skip_Long_Lines On

    [INPUT]
        Name tail
        Path /var/log/containers/recipe-app-*.log
        Tag recipe-app.*
        multiline.parser docker, cri
        Mem_Buf_Limit 100MB
        Skip_Long_Lines On

    [INPUT]
        Name tail
        Path /var/log/containers/*mongodb*.log
        Tag mongodb.*
        Parser mongodb_json_parser
        Mem_Buf_Limit 100MB
        Skip_Long_Lines On

    [INPUT]
        Name systemd
        Tag host.*
        Systemd_Filter _SYSTEMD_UNIT=kubelet.service
        Read_From_Tail On

  filters: |
    [FILTER]
        Name kubernetes
        Match recipe-app.*
        Merge_Log On
        Keep_Log Off
        Buffer_Size False
        K8S-Logging.Parser On
    
    [FILTER]
        Name kubernetes
        Match nginx.*
        Merge_Log On
        Keep_Log Off
        Buffer_Size False
        K8S-Logging.Parser On

    [FILTER]
        Name parser
        Match nginx.*
        Key_Name log
        Parser nginx_parser
        Reserve_Data On
        K8S-Logging.Parser On

    [FILTER]
        Name parser
        Match mongodb.*
        Key_Name log
        Parser mongodb_json_parser
        Reserve_Data On

    [FILTER]
        Name modify
        Match mongodb.*
        Set log_level ERROR
        Condition Key_value_matches msg .*error.*        
    
    [FILTER]
        Name modify
        Match mongodb.*
        Set log_level INFO
        Condition Key_value_does_not_match msg .*error.*

  outputs: |
    [OUTPUT]
        Name es
        Match recipe-app.*
        Index recipe-app-logs
        Type  _doc
        Host elasticsearch-master
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ELASTIC_PASSWORD}
        tls On
        tls.verify Off
        Logstash_Format On
        Logstash_Prefix recipe-app
        Retry_Limit False
        Suppress_Type_Name On

    [OUTPUT]
        Name es
        Match host.*
        Index recipe-app-node-logs
        Type  _doc
        Host elasticsearch-master
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ELASTIC_PASSWORD}
        tls On
        tls.verify Off
        Logstash_Format On
        Logstash_Prefix node
        Retry_Limit False
        Suppress_Type_Name On

    [OUTPUT]
        Name es
        Match nginx.*
        Index recipe-app-nginx
        Type  _doc
        Host elasticsearch-master
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ELASTIC_PASSWORD}
        tls On
        tls.verify Off
        Logstash_Format On
        Logstash_Prefix nginx
        Retry_Limit False
        Suppress_Type_Name On

    [OUTPUT]
        Name es
        Match mongodb.*
        Type  _doc
        Host elasticsearch-master
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ELASTIC_PASSWORD}
        tls On
        tls.verify Off
        Logstash_Format On
        Logstash_Prefix mongodb
        Retry_Limit False
        Suppress_Type_Name On

  customParsers: |
    [PARSER]
        Name nginx_parser
        Format regex
        Regex ^(?<remote_addr>[^ ]*) - (?<remote_user>[^ ]*) \[(?<time_local>[^\]]*)\] \"(?<method>[A-Z]+) (?<request>[^ ]*) (?<protocol>[^\"]*)\" (?<status>[0-9]{3}) (?<body_bytes_sent>[0-9]+) \"(?<http_referer>[^\"]*)\" \"(?<http_user_agent>[^\"]*)\"
        Time_Key time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name json_parser
        Format json
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%NZ

    [PARSER]
        Name regex_parser
        Format regex
        Regex /^(?<time>.+) (?<stream>stdout|stderr) [^ ]* (?<log>.*)$/
        Time_Format %Y-%m-%dT%H:%M:%S.%N%:z

    [PARSER]
        Name mongodb_json_parser
        Format json
        Time_Key t.$date
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ