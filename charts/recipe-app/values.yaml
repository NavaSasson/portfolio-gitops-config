# charts/recipe-app/values.yaml
replicaCount: 2

image:
  repository: 600627353694.dkr.ecr.ap-south-1.amazonaws.com/nava-recipe-app
  tag: latest
  pullPolicy: Always

# MongoDB values
mongodb:
  architecture: replicaset
  replicaCount: 3
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  arbiter:
    enabled: false
  auth:
    enabled: true
    rootUser: root
    usernames: ["admin"]
    databases: ["recipes"]
    existingSecret: "mongodb-secret"
    passwordKey: "mongodb-passwords"
    rootPasswordKey: "mongodb-root-password"
    replicaSet: "rs0"
    debug: true
  persistence:
    enabled: true
    size: "4Gi"
    storageClass: nava-ebs-sc
    accessModes:
      - ReadWriteOnce
  service:
    type: ClusterIP
    ports:
      mongodb: 27017
  # proper security context
  podSecurityContext:
    enabled: true
    fsGroup: 1001
    sysctls: []
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsNonRoot: true
