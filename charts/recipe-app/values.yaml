# charts/recipe-app/values.yaml
replicaCount: 2

image:
  repository: 600627353694.dkr.ecr.ap-south-1.amazonaws.com/nava-recipe-app
  tag: latest
  pullPolicy: Always

# MongoDB values
mongodb:
  architecture: standalone  # Changed from replicaset to standalone for simplicity
  auth:
    enabled: true
    rootUser: root
    usernames: ["admin"]
    databases: ["recipes"]
    existingSecret: "mongodb-secret"
  persistence:
    enabled: true
    size: "4Gi"
  service:
    type: ClusterIP
    ports:
      mongodb: 27017
  podSecurityContext:
    enabled: false  # Disable this to avoid PodSecurityPolicy issues
  containerSecurityContext:
    enabled: false  # Disable this to avoid SecurityContext issues
  networkPolicy:
    enabled: false  # Disable NetworkPolicy
  pdb:
    enabled: false  # Disable PodDisruptionBudget
  arbiter:
    enabled: false
  metrics:
    enabled: false
