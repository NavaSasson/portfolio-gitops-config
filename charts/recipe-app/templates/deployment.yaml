
# charts/recipe-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-recipe-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: recipe-app
  template:
    metadata:
      labels:
        app: recipe-app
    spec:
      containers:
        - name: recipe-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongodb-passwords
            - name: MONGO_DB
              value: {{ .Values.mongodb.auth.databases | first }}
            - name: MONGO_USERNAME
              value: {{ .Values.mongodb.auth.usernames | first }}
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_HOST
              value: {{ .Release.Name }}-mongodb-headless.{{ .Release.Namespace }}.svc.cluster.local