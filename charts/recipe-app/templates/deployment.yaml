apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-recipe-app
  labels:
    {{- include "recipe-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "recipe-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "recipe-app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: recipe-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: recipe-app-conf
          env:
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongodb-passwords
            - name: MONGO_DB
              value: {{ index .Values.mongodb.auth.databases 0 }}
            - name: MONGO_USERNAME
              value: {{ index .Values.mongodb.auth.usernames 0 }}
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_HOST
              value: "{{ .Release.Name }}-mongodb-headless.{{ .Release.Namespace }}.svc.cluster.local"